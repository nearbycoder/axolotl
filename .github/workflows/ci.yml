name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  kit:
    name: AxolotlKit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: swift test --package-path Packages/AxolotlKit

  server:
    name: Sync server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
        working-directory: server

  apps:
    name: Build apps
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: macOS build and tests
        run: xcodebuild -project Axolotl.xcodeproj -scheme Axolotl-macOS -destination 'platform=macOS' CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= test -quiet
      - name: iOS
        run: xcodebuild -project Axolotl.xcodeproj -scheme Axolotl-iOS -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= build -quiet
