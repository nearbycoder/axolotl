name: Axolotl
options:
  bundleIdPrefix: com.nearbycoder
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  AxolotlKit:
    path: Packages/AxolotlKit
settings:
  base:
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 4F2YLTHL8T
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  Axolotl-iOS:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - App/Shared
      - App/iOS
    dependencies:
      - package: AxolotlKit
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: Axolotl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Axolotl finds your other devices on this network to sync notes directly and privately.
        NSBonjourServices: [_axolotl._tcp]
        NSFaceIDUsageDescription: Axolotl uses Face ID to unlock the app and your locked notes.
        NSCameraUsageDescription: Axolotl uses the camera to scan documents and sync-code QR codes.
        CFBundleURLTypes:
          - CFBundleURLName: com.nearbycoder.axolotl
            CFBundleURLSchemes: [axolotl]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nearbycoder.axolotl
        PRODUCT_NAME: Axolotl
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
  Axolotl-macOS:
    type: application
    platform: macOS
    scheme:
      testTargets: [Axolotl-macOSTests]
    sources:
      - App/Shared
      - App/macOS
    dependencies:
      - package: AxolotlKit
      - target: axolotl-cli
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleDisplayName: Axolotl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: Copyright © 2026 Josh Hamilton. MIT License.
        NSLocalNetworkUsageDescription: Axolotl finds your other devices on this network to sync notes directly and privately.
        NSBonjourServices: [_axolotl._tcp]
        CFBundleURLTypes:
          - CFBundleURLName: com.nearbycoder.axolotl
            CFBundleURLSchemes: [axolotl]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nearbycoder.axolotl
        PRODUCT_NAME: Axolotl
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
  axolotl-cli:
    type: tool
    platform: macOS
    sources:
      - App/CLI
    settings:
      base:
        PRODUCT_NAME: axolotl
        PRODUCT_MODULE_NAME: AxolotlCLI
        PRODUCT_BUNDLE_IDENTIFIER: com.nearbycoder.axolotl.cli
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  Axolotl-macOSTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - App/Tests
    dependencies:
      - target: Axolotl-macOS
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Axolotl.app/Contents/MacOS/Axolotl
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
